name: Beatles News to Telegram

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 minutos -- abaixo disso o GitHub pode atrasar a execução
  workflow_dispatch: {}        # permite rodar manualmente pela aba Actions

permissions:
  contents: write   # precisa pra poder commitar o seen.json de volta

concurrency:
  group: beatles-news   # duas execuções ao mesmo tempo mandariam a mesma notícia duas vezes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python beatles_news.py

      - name: Salvar seen.json de volta no repositório
        if: always()   # mesmo se o script falhar no meio, não perde o que já foi enviado
        run: |
          git config user.name "beatles-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --quiet --cached || git commit -m "Atualiza histórico de notícias enviadas"
          git pull --rebase
          git push
